name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'

    - name: Create Flutter Project & Restore Code
      run: |
        # حفظ ملف الmain.dart القديم مؤقتاً
        mkdir -p temp_backup
        if [ -f lib/main.dart ]; then cp lib/main.dart temp_backup/; fi
        
        # إنشاء هيكل مشروع فلاتر جديد نظيف
        flutter create . --org com.ps4.installer --project-name ps4_installer --platforms android
        
        # إرجاع ملف الmain.dart الخاص بك
        if [ -f temp_backup/main.dart ]; then cp temp_backup/main.dart lib/; fi
        
        # بناء الAPK
        flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PS4-Installer-APK
        path: build/app/outputs/flutter-apk/app-release.apk
